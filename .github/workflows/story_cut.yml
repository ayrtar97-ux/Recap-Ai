name: Story Cut

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag with uploaded video (direct upload method). Leave empty to use link"
        default: ""
      video_url:
        description: "Video link (YouTube / direct / Google Drive) - used if release_tag is empty"
        default: ""
      transcribe_model:
        description: "Gemini model for Burmese transcription"
        default: "gemini-2.5-flash"
      select_model:
        description: "Gemini model for story selection (separate daily quota)"
        default: "gemini-2.5-flash-lite"
      target_seconds:
        description: "Target length in seconds (120-180)"
        default: "150"

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup ffmpeg
        timeout-minutes: 5
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install
        timeout-minutes: 5
        run: pip install google-genai yt-dlp gdown

      - name: Restore transcript cache
        if: inputs.release_tag != ''
        uses: actions/cache/restore@v4
        with:
          path: |
            work/tr
            work/transcript.json
          key: transcript-${{ inputs.release_tag }}-${{ github.run_id }}
          restore-keys: transcript-${{ inputs.release_tag }}-

      - name: Get video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.mp4" --pattern "*.mov" --pattern "*.mkv" --output input.mp4
          elif [[ "$VIDEO_URL" == *drive.google.com* ]]; then
            gdown --fuzzy "$VIDEO_URL" -O input.mp4
          else
            yt-dlp -f "bv*+ba/b" --merge-output-format mp4 -o input.mp4 "$VIDEO_URL"
          fi
          ls -lh input.mp4

      - name: Make story cut
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_SECONDS: ${{ inputs.target_seconds }}
          GEMINI_MODEL: ${{ inputs.transcribe_model }}
          SELECT_MODEL: ${{ inputs.select_model }}
        run: python story_cut.py input.mp4

      - name: Save transcript cache
        if: always() && inputs.release_tag != ''
        uses: actions/cache/save@v4
        with:
          path: |
            work/tr
            work/transcript.json
          key: transcript-${{ inputs.release_tag }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-cut
          path: |
            output/story_cut.mp4
            work/transcript.json
            work/selection.json